[project]
name = "errata-data"
version = "2026.11.2"
description = "A pipeline that collects developers' sessions with AI coding agents from six public sources into one dataset"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15",
    "httpx>=0.27",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# the examples and the README's queries
examples = ["duckdb>=1.1"]
# the names stage (collect names); spaCy 3.8.7 loads en_core_web_lg only with these helper versions (2026-10-24)
names = ["presidio-analyzer>=2.2", "spacy==3.8.7", "preshed==3.0.9", "cymem==2.0.10", "murmurhash==1.0.12"]

[project.scripts]
collect = "collect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collect*"]
